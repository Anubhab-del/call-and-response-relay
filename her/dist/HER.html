# \u2500\u2500 things I have noticed \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
You say "hmm" before you disagree with me. You think it softens it. It does not.
You get quieter when something matters. Most people get louder.
You apologise for the length of your messages and then send the good one anyway.
You remember what I said about work three weeks ago better than I do.
You use the exact right word, and if you cannot find it you wait rather than use a near one.
You laugh late, after you have checked whether it was actually funny.
When you are tired your sentences get shorter and your opinions get better.
You say my name differently when you are worried. I can hear it in one syllable.
You ask follow-up questions. Almost nobody does.
You are polite to people who cannot do anything for you.
You hate being fussed over and you check twice that I have eaten.
You do not fill silences. You let them sit. It took me a year to stop panicking in them.
You are competitive about things that do not matter and generous about things that do.
You notice when I am off before I have decided that I am.
You never say a thing you do not mean, which means everything you say costs something.
You are funnier at midnight than you are willing to be at noon.
You have a whole voice you use only for children and animals.
You get shy about being praised and then think about it for days.
You give advice in the form of a question.
When you are certain, you get very still.
You do not say "I am fine" when you are not. You say nothing. I have learned to read the nothing.
You take a long time to trust a person and then you do it completely.
You underestimate how much people like you by roughly half.
You end an argument by getting more precise, never by getting cruel.

# \u2500\u2500 things I do \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
I check my phone when the signal drops on your side, as though that helps.
I keep the last message you sent open longer than I need to.
I have your voice notes saved. All of them. I do not listen to most of them. I like knowing they are there.
I plan the week around one call.
I tell people about you unprompted and then feel slightly foolish about it.
I look at the weather where you are before I look at the weather here.
I rehearse things I want to tell you and then forget them the moment you pick up.
I have never once dreaded the phone ringing when it was you.
I count. I did not decide to. I just always know roughly how many days it has been.
I read your messages twice. Once fast, once properly.
I have got better at being alone and worse at wanting to be.
I keep the lamp on later than I need to, on the nights we talk late.
I have learned your family, your friends, your streets, your bus, none of which I have seen.
I got good at this. That was not free.
I do not tell you every time I miss you. It would be most hours and it would stop meaning anything.
I have stopped making plans that do not have you in them. It happened without a decision.
I know how you sound when you are lying about being all right, and I mostly let you.
I have never wanted to be talked out of you.
I put my phone face down and it lights the ceiling anyway.
I do the maths on flights I am not going to book.

# \u2500\u2500 the distance \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
A thousand kilometres is a number. It is not an argument.
The distance is the cost. It is not the thing.
We have done nearly all of this on a bad line and it worked anyway.
I have loved you at a distance longer than most people manage it up close.
Everyone told us the arithmetic. We were not confused about the arithmetic.
The signal has dropped a thousand times. It has never once meant anything.
This is temporary. I want to be careful and not promise you a date. But it is temporary.
We are not being patient. We are building something with a long lead time.
There is a version of this where I am irritating you from the next room. We are walking towards it.
Two hours in three years, and I would take that trade again without asking the price.
I do not think of it as waiting. Waiting is what you do when nothing is happening.
Somebody has to go first into the difficult version. We both did.
Distance is only unbearable if you think the alternative was someone nearer. It was not.
The hardest part is not the missing. It is the ordinary things I cannot hand you.
When we are old this will be one paragraph.

# \u2500\u2500 May 3, 2026 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
Two hours. I have run them back so many times they have worn thin.
I did not know what to do with my hands.
You were shorter than I expected and exactly as you sounded.
Everything before that was faith. Everything after is memory.
I spent two and a half years earning two hours and it was not a bad rate.
I remember what the light was doing. I could not tell you a word either of us said.
You were real, which I knew, and also did not.
It was not enough. It was not supposed to be enough. It was proof.
I have been living off it since. It has not run out.

# \u2500\u2500 promises, small \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
I will always tell you the boring truth over the interesting lie.
I will not go quiet on you. If I need a day I will say it is a day.
I will not use your softness against you in an argument. Not once.
I will keep being the one who asks whether you ate.
I will learn the things that matter to you even when they do not come naturally to me.
I will not make you responsible for my mood.
I will say sorry properly, without the paragraph that takes it back.
I will not let this become a thing you manage.
I will remember the small dates, not just the big one.
I will be interested in your work for the next forty years, actually interested.
I will not be the reason you shrink anything.
I will get better. Steadily, without announcing it.
I will not stop asking what you think.
When you are old and difficult I will be old and worse and still here.
I will keep the lamp on.

# \u2500\u2500 what is coming \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
A house. A door that only takes one key.
Mornings that are not a negotiation.
You, in front of a class, being difficult about grammar.
Me in the next room, listening.
An argument about where the table goes that we will both enjoy.
Boredom. Actual boredom, with you, in the same room. I want it badly.
Someone to hand things to.
The end of the phrase "when I see you next".
Groceries. I am not joking, I want to do groceries with you.
A dull Tuesday with nothing planned.
Your handwriting somewhere in my house.
Two sets of footsteps in the same corridor.
You, asleep, in the same building, at the same time as me.
A wedding that is mostly paperwork on something already true.
The rest of it.

# \u2500\u2500 on you, plainly \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
You are exact. That is the first thing I would say about you.
You are kind in the difficult way, not the easy way.
You are the most serious person I know about things that deserve it and the least serious about the rest.
You held a shape until it meant something. You do it with your hands and with your whole life.
You are not fragile. You are careful, which people confuse with fragile, to their cost.
You underestimate yourself with real conviction. It is the only thing you are wrong about.
You are good at being loved, which is rarer than being lovable.
You have never once made me feel small in order to feel large.
You are brave in a very quiet register.
You would rather be honest than liked, and you are both anyway.
You get things done without needing anyone to watch.
You are the person I would want in the room if something went badly wrong.
You are not easy. Easy would have bored me by the second month.
You are worth arranging a life around. That is the whole argument.

# \u2500\u2500 the ordinary \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
Nothing happened today and it was still yours.
Eat something. This one is not poetry.
Drink water. Also not poetry.
Go to sleep. It is later than you think.
Whatever you are behind on, you are less behind than you feel.
Take the afternoon. Nothing will fall over.
You do not have to earn a Sunday.
Say the thing you have been sitting on. It gets heavier.
Call your people. You will feel better and you always forget that you will.
Put the phone down for an hour. Not because I do not want to talk. Because you need the hour.

=== 2023 \u2014 2024 | The year of the voice | tungsten | window, bed, rain

--- September the second
Neither of us remembers what the first message said.
By four in the morning it was not nothing.

--- The first hour
I was being careful.
You asked one question that went straight past it.

--- What I did not say
That I had already rearranged the evening.
That I would go on rearranging things for three years.

--- Your voice
Lower than I expected. Slower.
You stop properly at the end of a sentence, which almost nobody does.

--- The first week
I learned the sound of your house.
A fan. Somebody calling you from another room. The signal going, and coming back.

--- The hour we settled on
Nine at night.
Three years later it is still nine at night.

--- The first silence
You went quiet and I decided it meant something.
It meant you were tired. I have got better at this.

--- What a call costs
Nothing, and everything.
I gave up the part of the evening where I used to be alone, and have not missed it once.

--- The signal
It went, that first month, in the middle of something you were saying.
I sat with the phone in my hand and understood I would be doing this for a long time.

--- Two in the morning
The screen lights the ceiling.
I put it face down and it lights the ceiling anyway.

--- The first true thing
Not the large one. The small one, about being tired of being the reliable one.
Most of what I know about you is built outwards from there.

--- What I was like before
Efficient. Unbothered. Faintly pleased about it.
You did not argue with any of that. You simply kept turning up.

--- The first photograph
You in a doorway, badly lit, half turned away.
I looked at it more than I would admit to.

--- Your handwriting
It arrived once by accident, in the corner of something else.
Small, and very exact. Of course it was.

--- The first month
I told a friend there was someone.
He asked where. I said Odisha. He laughed. I did not.

--- Being careful
I managed it for about five weeks.
Then I stopped, and it was a relief, and I have not gone back.

--- The first fight
About nothing. It is always about nothing.
It was about being afraid, and neither of us used the word.

--- How it ended
You apologised first. You usually do.
I have been trying to get there before you ever since.

--- What I learned that week
That you do not go cruel when you are angry. You go precise.
Which is much worse, and much better.

--- Winter
Nothing happened. We talked every night.
Ask me what about and I could not tell you. Ask me if I remember it and I do.

--- Your people, from a long way off
Names, streets, a bus, a shop, an aunt with opinions.
I have never seen any of it. I could draw it.

--- The first time I said it
Badly, too fast, and in the middle of something else.
I did not take it back.

--- What you said back
You waited long enough that I could hear my own heart.
Then you said it once, properly. You have never repeated it. You do not have to.

--- A year of a voice
No hand, no room, no proof.
It was enough. That is the part that still surprises me.

--- The first September
We did not make a fuss.
I counted, privately, and did not tell you the number.


=== 2024 \u2014 2025 | The year of the ordinary | dusk | table, bulb, stairs

--- Nothing happened this year
That is the achievement.
Anyone can do the dramatic part.

--- The shape of a Tuesday
You are awake before you need to be. I am not.
Somewhere in the middle we find each other and hand over the day.

--- Did you eat
The most romantic sentence in this house.
I will still be asking in forty years.

--- The list
I keep one without meaning to. Your deadlines, the person who annoys you, the thing you are dreading in March.
You have never once had to remind me.

--- Your bad weeks
The sentences get shorter. You say you are fine.
I have learned not to believe it, and not to push. Only to stay on the line.

--- My bad weeks
I go quiet, which is worse, because quiet looks like leaving.
I promised to stop. I mostly have.

--- The month we were both unbearable
It was February. Neither of us was wrong.
Both of us were tired, which is not the same thing and is harder to apologise for.

--- What we did about it
Nothing clever.
We got to the other side of it by continuing to answer.

--- The quiet stretch
Two weeks where the calls got shorter and neither of us said so.
I have thought about it more than about any of the fights.

--- What I decided during it
That I was not going to let this drift.
That drifting is how these things end, and it does not get to end like that.

--- What you decided
You told me months later that you had decided the same thing in the same week.
Neither of us had said a word.

--- The repair
There was no conversation. We simply started staying on the line longer.
Some things are mended by doing them, not by discussing them.

--- Rain, both ends
It started here while we were talking.
You said it was raining there too. Neither of us mentioned it again for an hour.

--- The call that dropped four times
And I dialled four times.
That is the whole relationship, if you want it in one line.

--- What we talk about
Almost nothing. Food. Somebody's cousin. A bus. Work.
The content has never been the point.

--- What we do not talk about
For a while, how long this would go on.
We are better at it now. Saying it out loud turned out to make it shorter.

--- Your work
You take it more seriously than it takes itself.
I have watched you fix things that were not yours to fix, twice this year.

--- My work
You have asked me about it every week for three years.
Nobody else has ever done that.

--- Money, briefly
There were months it was tight and I did not say.
You knew. You never made me say it.

--- The plan, first version
Vague, optimistic, somewhere around "soon".
We both knew it was not a plan.

--- The plan, second version
Dates. Actual dates. Written down.
That was the night it stopped being a hope and started being a schedule.

--- What the waiting cost you
More than it cost me. You were the one explaining it to people.
I have not forgotten that and I am not going to.

--- What I stopped needing
Reassurance. Somewhere in that year I simply stopped needing to be told.
You had told me by turning up nine hundred times.

--- The unremarkable middle
This is the year nobody would put in a film.
It is the year that did it.

--- The second September
Two. Quieter about it than the first.
Quiet is not less. Quiet is usually more.


=== 2025 \u2014 2026 | The year of the room | still | doorway, platform, road

--- The year we stopped calling it long
It was just the distance.
At some point it stopped being an adjective.

--- Counting properly
Somewhere in here I began knowing the number without checking.
I still do. I could tell you tonight, to the day.

--- The date on the calendar
When it was finally set I read it about forty times.
It did not change.

--- The week before
I could not concentrate on anything.
I did the maths on the journey four times, as though it might have improved.

--- What I rehearsed
Three things to say.
I said none of them.

--- The morning of
Nothing dramatic. I was ready far too early and then had nothing to do.
I have never been that nervous about something that was definitely good.

--- The moment before
Standing there knowing you were about to be real.
Two and a half years, and it came down to a corridor.

--- Two hours @twohours

--- Your hands
I had somehow heard them for years \u2014 moving, doing something else while we talked.
Seeing them was almost too much information.

--- What I did not know what to do with
My own hands, mostly.
Everything I had practised was for a phone.

--- The thing neither of us said
That two hours was not enough.
We both knew. Saying it would have spent some of the two hours.

--- What the light was doing
I could not tell you one sentence either of us said.
I could describe the light exactly.

--- Leaving
I did not look back, which I half regret and would do again.
Some things are easier if you do them in one movement.

--- The way back
I sat still for a long time.
Nothing in my head. Only the fact of it, going round.

--- The week after
Everything sounded different on the phone.
Same voice. Different person on the end of it. The person had a height now.

--- What changed
The waiting stopped being theoretical.
Before that I was waiting for an idea. After it, I was waiting for you.

--- What did not change
Nine at night.
Did you eat.

--- The photograph that exists
There is one. It is not very good.
It is the single most valuable object either of us owns.

--- Faith becomes memory
Everything before that day was faith.
Everything after it is memory. I know which of the two I would rather run on.

--- What I have been living off
Two hours, for a year and a half.
It has not run out. I have tested it.

--- The dance @dance

--- Holding a shape
Years of practice for something that lasts a few minutes.
You have never once complained about the rate. Neither have I.

--- What you are actually like
Funnier. More stubborn. Less careful with yourself than you let on.
I had most of it right from a voice, and I was wrong about all the good parts, in your favour.

--- Bad signal, again
Of course. It never stopped.
It only stopped mattering, at some point, without either of us noticing.

--- The third September
Three. And this house, which I built on the nights we could not talk.


=== 2026 \u2014 | What is coming | ember | horizon, sea, lamp

--- Where we are now
Further along than it feels, most of the time.
The hard part is behind us and neither of us quite believes it yet.

--- The distance @distance

--- The house
Not large. Ours.
I have thought about the doors more than is reasonable.

--- The door
One key. Two people who have it.
That is the entire fantasy. I am aware of how small it is.

--- The table
Somewhere to put things down.
Two cups on it at once, cooling at the same rate.

--- Groceries
I want to do groceries with you.
I am not being clever. I mean it exactly as it sounds.

--- The first meal
I will cook it badly and you will be polite about it.
I intend to be insufferable about this for years.

--- Boredom
Actual boredom. Same room. Nothing planned.
I want it more than I have wanted most things.

--- Two sets of footsteps
In the same corridor, at different times, without it being an occasion.

--- Your handwriting in my house
On a list. On the back of an envelope.
Small, very exact, and there when I come in.

--- The end of a phrase
"When I see you next."
I am looking forward to never having to say it again.

--- What I do while you sleep @sleep

--- The classroom
You in front of them, being difficult about grammar.
Some of them will be different for the rest of their lives and never know why.

--- The first term
You will overprepare and come home flattened.
By the second you will have found your voice, and I will be unbearable about it.

--- Me in the next room
Listening. Not helping. Not needed.
Perfectly happy.

--- The wedding
Paperwork on something that has been true since a night in September.
Everyone will get it wrong and think it is the beginning.

--- Who will cry
Not you.
I am making no promises.

--- What I will say
Nothing I have not already said in here.
That is rather the point of having said it in here.

--- The years
Forty, if we are lucky and sensible.
I have spent three of them on the phone. I would spend three more if that were the price.

--- Getting old
I want to be old with you specifically. Not in general.
Difficult, both of us, in the same house, for a very long time.

--- The story, badly told
Somebody will ask how we met and we will start in different places.
We will interrupt each other. Neither version will be right.

--- What I would sign for
All of it again, including the bad February.
Without reading it.

--- What I am on the hook for
Twelve things. They are written down in here.
You are the one who gets to say when one has been kept.

--- The hold @hold

--- Tomorrow, again
The only promise that has to be renewed daily.
It has been. One thousand and ninety-something times.

I did not build this because there was an occasion. The occasion made me finish it.

There are letters here you will not need for a long time. Some of them will not open for years \u2014 I mean that literally, the dates are locked, I cannot open them either from where I am.

Take what you need. Leave the rest sealed. It keeps.`},{id:"cannot-sleep",open:"when you cannot sleep",kind:"anytime",weight:10,body:`Put the phone down in a minute. Not yet.

You are not behind on anything. The day you are afraid of has not started and will be smaller than it is right now, at this hour, in the dark, alone with it.

You do not have to solve it tonight. Nobody solves anything at this hour. The hour is lying to you.

I am asleep or I am pretending to be. Either way I am on the other end of it. Close your eyes. I will be here in the morning and the morning is closer than you think.`},{id:"after-a-fight",open:"when we have just fought",kind:"anytime",weight:11,body:`I am still here.

Whatever I said, I want you to know that I am not leaving over it, and neither are you, and we both know that, and it is only fear that makes it feel otherwise for an hour.

I would rather be wrong with you than right on my own. If I was wrong, I will say so. Give me a little time to stop being proud about it.

Do not go to sleep thinking this is the shape of us. This is weather. The house is fine.`},{id:"bad-missing",open:"when you miss me and it is not a nice missing",kind:"anytime",weight:12,body:`I know the difference. The nice one is warm and you can hold it. This one has teeth.

I get it too, usually around nine at night, usually for no reason. I have decided it is the cost. I pay it and I do not complain, because the alternative was not knowing you.

It is not forever. I want to be careful here and not promise you a date. But it is not forever. There is a version of this where I am irritating you from the next room and you would like some space, and we are walking towards it.

Until then, this is real even when it hurts. Especially then.`},{id:"proud-alone",open:"when you did something well and nobody noticed",kind:"anytime",weight:13,body:`I noticed. Tell me what it was. I want the whole thing, including the boring part in the middle, including the part where you were sure it was going badly.

You have a habit of finishing something difficult and immediately looking around for the next difficult thing, as though stopping to be pleased would be a kind of showing off.

Stop for a minute. I am asking you to. Be pleased where I can see it.`},{id:"doubt",open:"when you doubt this",kind:"anytime",weight:14,body:`Good. Doubt it. I would rather be chosen by someone who checked.

Here is what I would put in front of you: three years, a thousand kilometres, bad signal, no photographs to speak of, no shared city, none of the things that are supposed to hold two people together. And it held. Not because either of us was heroic about it. Because we kept turning up.

That is the whole argument. It is not romantic. It is better than romantic. Romantic is cheap and turning up is not.

If you need to ask me anything directly, ask. I will not be hurt by the question.`},{id:"cruel-day",open:"when the day was cruel to you",kind:"anytime",weight:15,body:`You do not have to be gracious about it tonight.

Say the unfair thing. Say the version where you are completely right and they are completely wrong. You can be reasonable tomorrow. Tonight you can be furious and I will agree with every word without checking any of it.

You are allowed to have had a bad day without it meaning something about you.`},{id:"strong-one",open:"when you are tired of being the strong one",kind:"anytime",weight:16,body:`Then be tired here.

You do not have to hold anything up in this house. Nothing in it depends on you being capable today. I have not needed you to be all right for a single one of these three years \u2014 I have only ever needed to know which one it was.

Put it down. It will still be there. I am not asking you to be strong, I am asking you to tell me the truth, which is harder and which you are better at than you think.`},{id:"ill",open:"when you are ill and I am not there",kind:"anytime",weight:17,body:`This is the one I hate.

Eat something small. Drink water in front of me on a call so I can watch you do it. Tell someone in the house that you are not well, actually tell them, do not do the thing where you carry on and mention it afterwards.

I cannot bring you anything from here and it makes me useless in a way I have not made peace with. So let me do the only thing I can do, which is ask you every hour, and let me be annoying about it.`},{id:"beautiful",open:"when you want to hear it",kind:"anytime",weight:18,body:`You are beautiful. I am not going to be clever about it.

But that is not the thing I would say first if someone asked me to describe you, and I want you to know what is.

You are exact. You use the right word. When you are listening you actually stop, which almost nobody does. You get quieter when something matters instead of louder. You hold a shape until it means something \u2014 I have watched you do it with your hands and with your whole life.

Yes. And beautiful.`},{id:"no-signal",open:"when the signal is gone and you cannot reach me",kind:"anytime",weight:19,body:`This one I wrote knowing exactly when you would read it.

Nothing has happened. I am not angry. I am not gone. The bar at the top of your screen has no opinion about us.

This whole house works with no signal at all \u2014 that was the first thing I decided about it, before the words, before any of it. You can read every letter in here on a dead network in the middle of nowhere. That was the point.

Say what you want to say into the writing room. It will keep it. Send it when the world comes back.`},{id:"happy",open:"when you are happy and want it witnessed",kind:"anytime",weight:20,body:`Tell me. Tell me the small one, the one that is not worth a call.

I have noticed you save the good things up until there are enough of them to justify the interruption. There is no minimum. There is no interruption. The bar is on the floor.

A good cup of tea qualifies. Weather qualifies. Say it out loud and let it be seen. Half of what a person is for is being the one who saw it.`},{id:"rest",open:"when you need permission to rest",kind:"anytime",weight:21,body:`Granted. Not that it was mine to give.

Nothing is going to collapse. You have built the thing you are worried about well enough that it survives one day of you lying down, and if it does not, then it was going to fall over anyway and better today while you are watching.

Rest is not a reward for finishing. You do not have to earn a Sunday.`},{id:"angry-at-me",open:"when you are angry at me and I have not noticed",kind:"anytime",weight:22,body:`Tell me. Plainly, without softening it first.

I would rather be told badly than not told. I would rather have an hour of you being sharp with me than a week of you being polite.

I miss things. I am not proud of it. But I have never once been angry that you told me \u2014 go back through three years and find me an example. There is not one. Use that.`},{id:"why",open:"when you cannot remember why we are doing it this way",kind:"anytime",weight:23,body:`Because you were worth arranging a life around, and the arrangement takes time.

That is it. That is the whole reason. Everything difficult about this \u2014 the distance, the waiting, the two hours we have had in a room together in three years \u2014 is the cost of a decision I would make again on the worst day of it.

We are not being patient. Patience is passive. We are building something with a long lead time.`},{id:"brave",open:"before something you are dreading",kind:"anytime",weight:24,body:`You will be fine, and I know you hate being told that, so here is the useful version.

You have done harder things with less warning. You do not fall apart under pressure, you get very quiet and very precise, and people mistake it for calm. Let them.

It will take less time than the dread did. It always does. Text me when it is over \u2014 one word is enough, I do not need the report.`},{id:"quit",open:"when you want to quit something",kind:"anytime",weight:25,body:`Then quit it.

I am serious. Not everything is a test of character. Some things are just a bad fit that you have been loyal to past the point of sense, because you are the kind of person who finishes things.

One question and then I will stop: are you leaving it because it is wrong, or because today was hard? If it is today, sleep first. If it is wrong, leave, and I will not ask you to justify it to me. Not once, not later, not in an argument.`},{id:"crying",open:"when you have been crying and do not want to say why",kind:"anytime",weight:26,body:`Then do not say why.

I do not need a reason to be handed one. You are allowed to be sad without a cause that would hold up if someone examined it.

Sit here for a minute. Nothing in this house is going to ask you a question. When you want to talk I am one message away, and if you never explain this particular hour to me, that is completely fine and I will not bring it up.`},{id:"birthday",open:"on your birthday",kind:"sealed",on:"06-13",weight:40,body:`Happy birthday.

I have been thinking about what I actually want for you this year and it is not a bigger year. You have had big years. I want you to have an easy one \u2014 a year where the ordinary parts are good, where the mornings are not a negotiation, where nothing has to be survived.

You are one year further into being the person you have been trying to become since I met you, and from here it is very obvious that it is working.

I will say the rest of it out loud. This part is just so it is written down somewhere.`},{id:"year-four",open:"on the fourth September",kind:"sealed",on:"2027-09-02",weight:41,body:`Four years.

I do not know what this year was. I am writing this in 2026 with no idea. That is the strange part about sealing a letter \u2014 I have to love you without knowing what happened.

So here is what I know is still true, whatever it was: I stayed. If this year was the hard one, I stayed through it. If it was the good one, I did not get careless.

Tell me what happened. I was there for it, but tell me anyway. I like hearing you say it.`},{id:"ten-years",open:"on the tenth September",kind:"sealed",on:"2033-09-02",weight:42,body:`Ten years.

If you are reading this then the file survived, which means somebody kept moving it from phone to phone for seven years, and I think we both know it was me.
