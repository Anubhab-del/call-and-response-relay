# \u2500\u2500 things I have noticed \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
You say "hmm" before you disagree with me. You think it softens it. It never has, and I love it.
You get quieter when something matters. Everyone else in the world gets louder.
You apologise for the length of your messages and then send the good one anyway.
You remember what I said about work three weeks ago better than I do, and you bring it back at exactly the right moment.
You use the exact right word, and if you cannot find it you wait, rather than use the one standing nearby.
You laugh late \u2014 after you have checked whether it was actually funny \u2014 and that late laugh is the one I work for.
When you are tired your sentences get shorter and your opinions get sharper and I like you even more.
You say my name differently when you are worried. I can hear it in one syllable, from a thousand kilometres.
You ask follow-up questions. Almost nobody does. It is the most underrated form of love there is.
You are gentle with people who cannot do anything for you, which is the only test that has ever meant anything.
You hate being fussed over and you check twice that I have eaten.
You do not fill silences. You let them sit. It took me a year to stop panicking inside them and now they are my favourite part.
You are fiercely competitive about things that do not matter and endlessly generous about the things that do.
You notice I am off before I have decided that I am.
You never say a thing you do not mean, which means everything you have ever said to me cost you something.
You are funnier at midnight than you are willing to be at noon, and I have stayed up for years to get at it.
You have a whole voice you keep only for children and animals, and hearing it does something to me.
You get shy about being praised and then think about it for days. I know. I count on it.
You give advice in the form of a question, and it works every single time.
When you are certain, you go very still. I have learned to watch for it.
You do not say "I am fine" when you are not. You say nothing at all. I have learned to read the nothing.
You take a very long time to trust a person and then you do it completely, with nothing held back.
You underestimate how much people like you by roughly half. Possibly more.
You end an argument by getting more precise, never by getting cruel, and I have never once been afraid of you.
The way you say "achha" when you have decided something. I would know it anywhere.
You hold your breath slightly before you say something that matters. I hear it. I always wait.

# \u2500\u2500 things I do \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
I check my phone when the signal drops on your side, as though that could possibly help.
I keep the last message you sent open longer than I need to, and then I read it again.
I have every voice note you have ever sent me. I do not listen to most of them. I like knowing they are there.
I plan the whole week around one call, and I would plan a life around it, and I am about to.
I tell people about you unprompted and then feel faintly foolish and then do it again the next day.
I look at the weather where you are before I look at the weather here.
I rehearse things I want to tell you and forget every one of them the moment you pick up.
I have never once dreaded the phone ringing when it was you. Not once, in three years.
I count. I did not decide to. I simply always know roughly how many days it has been.
I read your messages twice. Once fast, because I cannot help it, and once properly.
I have got better at being alone and much worse at wanting to be.
I keep the lamp on later than I need to on the nights we talk late.
I have learned your family, your friends, your streets, your bus \u2014 none of which I have ever seen.
I got good at this. I want you to know that was not free.
I say goodnight and then stay on the line for a moment after, every time, hoping you will say one more thing.
I have a photograph of a doorway that I have looked at more times than I would ever tell you.
I have arranged my whole evening around nine o'clock for three years and never once resented it.
I hear a song and immediately want to know what you would think of it.
I save things to tell you. Small things. Things that would not survive being told to anyone else.
I have imagined the sound of your keys in a door I do not own yet.
I have written and deleted more messages to you at two in the morning than I have ever sent.
I check the time in your city out of habit, even though it is the same time.

# \u2500\u2500 the distance \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
One thousand two hundred and eighty-seven kilometres. I have never once thought of it as far.
Distance is only a number. It has never been an argument, and it has never been a reason.
The distance is not the hard part. The hard part is that there is nothing to do about it but wait well.
I have loved you across a whole country and it never once felt like less.
Some nights the distance is furniture. Some nights it has teeth. Tonight it is only furniture.
Everyone told us the arithmetic. We were never confused about the arithmetic.
It is a train and a night and a morning. It is not the sea. It is not the moon.
People say long distance as though it were a diagnosis. It is a postcode.
Every kilometre of it has been paid for and I would pay again.
The distance has taken three years from us and given us three years of talking properly. I am not sure it owes me anything.
Somewhere there is a photograph of us that has not been taken yet.
I have never had to wonder where you are. Only how far, and that is arithmetic, and arithmetic ends.
It is a number that is going to become zero. That is the only thing I know about the future for certain.
Two roofs, one weather, most nights.
The map is wrong about us. It thinks we are apart.

# \u2500\u2500 the third of May \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
Two hours in the same room, in three years. I have made them last eighteen months.
I could not tell you one sentence either of us said. I could describe the light exactly.
Your hands were smaller than I had built them, and better.
Everything before that day was faith. Everything since has been memory.
I did not look back when I left. I half regret it and I would do it again.
I have run those two hours back so often they have worn thin in places.
There is one photograph and it is not good and it is the most valuable thing either of us owns.
The corridor. I will remember that corridor when I have forgotten most things.
Two hours was cruel and I would take two hours again tomorrow, and again the day after.

# \u2500\u2500 promises, small \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
I will always dial again.
I will never go quiet on you. If I need a day I will say it is a day.
You get the boring truth. Always. Even when the interesting lie would be kinder.
Nothing you tell me softly gets used against you later. Not once, not ever.
I will keep asking whether you ate, in forty years, from the next room.
I will apologise without the paragraph that takes it back.
I will not become something you have to manage.
I am never the reason you make anything about yourself smaller.
I will remember the small dates, not only the big one.
The lamp stays on. Whatever hour, whatever state, whatever you have to tell me.
Tomorrow, again. That is the only one that has to be renewed daily, and it has been.
I will be interested in your work for the rest of my life, and not politely.
If I am ever wrong I will say so on the day, not the following week.
I will not let this drift. Drifting is how these things end and it does not get to end like that.
You will never have to guess what is going on with me.

# \u2500\u2500 what is coming \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
A door with one key and two people who have it. That is the entire fantasy and I am aware of its size.
Two cups on a table at once, going cold at the same rate.
Groceries. I am not being clever. I want to do the groceries with you.
Actual boredom, in the same room, with nothing planned. I want it more than most things I have worked for.
Your handwriting somewhere in my house, on the back of an envelope, not addressed to anyone.
Two sets of footsteps in the same corridor at different hours, without it being an occasion.
The end of the phrase "when I see you next". I will not miss it.
Waking up somewhere that is also yours.
Arguing about the heating. I have thought about this specific argument with real longing.
You in front of a class, being difficult about grammar, changing somebody's life by accident.
Me in the next room. Listening. Not needed. Perfectly happy.
Forty years, if we are lucky and sensible. I have already spent three on the telephone.
Getting old with you specifically. Not in general. Not with somebody.
A Sunday with nothing in it.
The first meal, cooked badly, received politely, remembered for decades.

# \u2500\u2500 on you, plainly \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
You are the most exact person I have ever met and it is the sexiest thing about you.
You are beautiful, and it is somehow the fourth or fifth most interesting thing about you.
You are kind in the specific, expensive way \u2014 the kind that costs you something and that you never mention.
You are much braver than you have been told.
You are the only person who has ever asked me the second question.
You are funny in a way that arrives half a second late and is worth the wait.
You are stubborn, and I have never once wanted you to be less so.
You are the calmest person in every room you are in, and the least calm inside, and almost nobody knows.
You are better at being loved than you believe, and getting better at it every year.
You have never bored me. Not for one minute of three years.
You are the person I would choose in any life, in any city, at any distance.
There is nobody else. I have checked. I did not have to check.
You are not too much. You have never once been too much.
You are, and this is the plainest thing I know how to say, the love of my life.

# \u2500\u2500 the ordinary \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
Nothing happened today and it was still yours.
An ordinary Tuesday with your voice in it is better than most people's holidays.
We have made something out of almost nothing and I am extremely proud of us.
The content has never been the point. The point is that one of us dials and the other answers.
Half of loving someone is being the one who saw it.
A bad line and forty minutes of nothing much. I would not trade it.
Most of this has been unremarkable and all of it has been the best part of my life.
Nine at night. Still. After everything.
We have talked about food more than about the future and I think that was correct.
You told me about a bus today and I listened like it was news.
Nobody is going to make a film about this year. It is the year that did it.
The very ordinariness of us is the achievement. Anyone can manage the dramatic part.
I have never needed anything to happen. I have only needed you to pick up.
A quiet evening, the two of us, a thousand kilometres apart, entirely content.
Some nights we have nothing to say and stay on the line anyway.
The small talk is not small. It is the whole load-bearing structure.
I like you. That gets said less than the other thing and it matters just as much.
You are the best part of every single day and most days are not eventful.
There has not been one day in three years I did not want to talk to you.
An evening with no news in it is still an evening with you in it.

# \u2500\u2500 us, mechanically \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
The call that dropped four times, and I dialled four times.
Three years, mostly on a phone, and never once out of obligation.
We got through February by continuing to answer. That is the whole method.
There was no conversation about the repair. We simply started staying on longer.
We have never gone to sleep on it. Not once. That was not luck.
Neither of us has ever hung up first on purpose.
We decided the same thing in the same week and told each other months later.
We have had exactly one bad fortnight in three years and we both remember it.
Nothing clever has ever saved us. Only turning up.
We are not being patient. Patience is passive. We are building something with a long lead time.
It held. Not because either of us was heroic. Because we kept turning up.

# \u2500\u2500 the plain ones \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
I love you.
I have loved you since a night in September when neither of us was being careful.
I am not going anywhere.
You are the person.
I would do all of it again without reading it first.
There has never been a day I wanted to be somewhere else.
I chose you and I keep finding out that I have chosen you again.
You are my favourite thing that has ever happened.
I am so glad it was you.
Nothing about this has been a mistake.
I would rather be wrong with you than right on my own.
I am proud to be the person you tell things to.
I have never once had to convince myself.
Whatever this is, it is the real one.
You are worth arranging a life around, and I am arranging it.

# \u2500\u2500 things I want to know \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
What you were like at nine.
What you thought of me, honestly, in the first month.
The thing you almost told me and decided was not worth it.
What you want that you have not let yourself want out loud.
What you would do with a free week and nobody to answer to.
What you are afraid I will get tired of. There is nothing.
What you need more of that you have not asked for.
Which of your own opinions you would defend to the end.
What made you laugh today that nobody else would have found funny.
What you were thinking about in the pause just then.
The thing about your childhood you have only told two people.
What you want the house to be like. Actually, in detail, room by room.

# \u2500\u2500 late night \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
It is very late where you are and I am glad you are here.
Nothing gets decided well at this hour. Decide it in the morning.
The dark makes things bigger. It is extremely good at that and it is lying.
If you cannot sleep, do not solve it. Just be awake with me for a bit.
Two in the morning is not a good adviser and has never given anyone useful counsel.
Put your feet somewhere warm. Let your shoulders come down.
I am asleep or pretending to be. Either way I am on the other end of it.
The morning is closer than it feels from here.
Whatever it is, it will be smaller at eight.
You do not have to be anything at this hour. Not even all right.

# \u2500\u2500 seasons and weather \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
It started raining here while we were talking and you said it was raining there too.
Two roofs, one weather, and neither of us mentioned it again for an hour.
The first cold evening of the year always makes me want to be in the same room as you.
Monsoon takes the signal and gives back the sound of rain behind your voice. A fair trade, most nights.
Summer here is unreasonable and I would still rather you were in it.
There is a particular quality of light around seven that I have never been able to describe to you properly.
The rain on the window is doing the same thing at both ends of this call.
Every season so far has been on a phone. The next ones will not be.

# \u2500\u2500 the difficult ones \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
There was a fortnight I was genuinely frightened and I never told you at the time.
February was nobody's fault, which made it worse.
I have gone quiet on you and I am not proud of it.
Some nights the missing has teeth and there is nothing to be done but get through the evening.
I have wanted to be in the room so badly it was physically uncomfortable.
There were months when money was tight and I did not say and you knew anyway.
The waiting has cost you more than it cost me. You were the one explaining us to people.
I have been jealous of anyone who gets to see you on an ordinary Tuesday.
Not all of this has been beautiful. All of it has been worth it.

=== 2023 \u2014 2024 | The year I loved a voice | tungsten | window, bed, rain

--- September the second
Neither of us can tell you what the first message said, which seems right.
Nobody writes down the hour the weather turns.
By four in the morning I had stopped pretending it was conversation.

--- The first hour
I was being careful, the way you are careful on a ledge.
You asked one soft question that went straight under it,
and I answered you honestly, and that was the end of being careful.

--- What I did not say
That I had already given the evening away.
That I would go on giving away evenings, and then years,
and never once feel that anything had been taken.

--- Your voice
Lower than I expected. Slower. Like you had all the time in the world
and had decided to spend a little of it on me.
I have heard it through a thousand bad connections and never wanted a better one.

--- The first week
I learned the sound of your house before I learned the shape of it.
A fan turning. Someone calling you from another room.
I loved a place I had never stood in, because you were somewhere inside it.

--- Nine at night
We chose the hour the way you choose a table you will keep coming back to.
Three years on it is still nine, and my whole day still leans toward it
the way a plant leans at a window.

--- The first silence
You went quiet and I filled it with everything I was afraid of.
It turned out you were only tired.
I have spent three years learning the difference, and I love the learning.

--- What a call costs
Nothing. Everything.
I gave away the part of the evening where I used to be alone with myself,
and I have not missed him once.

--- The signal
It went, that first month, in the middle of a sentence of yours I never got back.
I sat in the dark holding a warm phone,
and understood, quite calmly, that I would do this for as long as it took.

--- Two in the morning
The screen lights the ceiling and I turn it face down,
and the ceiling stays lit anyway, and so do I.
There are worse ways to lose a night than to your name.

--- The first true thing
Not the large one. The small one \u2014 about being tired of being the reliable one.
You said it quickly, as though it did not count.
Everything I know about you is built outward from that sentence.

--- What I was like before you
Efficient. Unbothered. Faintly pleased with myself about both.
You never argued with any of it.
You simply kept turning up until the man who did not need anyone was gone.

--- The first photograph
You in a doorway, badly lit, half turned away from whoever was holding the camera.
I looked at it far more than I would ever have admitted,
and I have never needed it to be a better photograph.

--- Your handwriting
It arrived once by accident, in the corner of something else.
Small, and very exact, and unmistakably yours.
I looked at it the way people look at a hand they intend to hold.

--- Telling someone
I said, there is someone. He asked where.
I said Odisha, and he laughed, and I did not,
and that was the first time I heard how serious I had become.

--- The end of being careful
It lasted about five weeks.
Then I stopped, all at once, the way you stop holding your stomach in,
and it was such a relief that I have never gone back.

--- The first fight
About nothing. It is always about nothing.
Underneath it we were both frightened of how much this had come to matter,
and neither of us was brave enough to use that word yet.

--- How it ended
You said sorry first. You almost always do.
I have spent every year since trying to get there before you,
and losing, and being glad to lose.

--- What I learned that week
That you do not go cruel when you are hurt. You go precise.
Which is harder to survive and far better to be loved by.
You have never once said a thing to me that you would need to take back.

--- Winter
Nothing happened. We talked every night.
Ask me what about and I could not tell you a single subject.
Ask me if I remember that winter and I will tell you it was one of the happiest of my life.

--- Your people, from a thousand kilometres
Names, streets, a bus, a shop, an aunt with opinions about everything.
I have never seen any of it and I could draw all of it,
because you handed me your whole world in pieces, night after night, for free.

--- The first time I said it
Badly. Too fast. In the middle of something else entirely,
like a man dropping something he had been carrying too long.
I did not take it back. I have never wanted to.

--- What you said back
You waited long enough that I could hear my own heart doing its work.
Then you said it once, quietly, properly.
You have never repeated it. You have never needed to. I heard it the first time.

--- A year of only a voice
No hand. No room. No proof of any kind that would stand up anywhere.
And it was enough \u2014 that is the part that still stops me \u2014
a voice at nine o'clock was enough to build a life on.

--- The first September
We did not make a fuss. Neither of us is built for fuss.
I counted the days privately and did not tell you the number,
and I have not stopped counting since.

=== 2024 \u2014 2025 | The year of ordinary love | dusk | table, bulb, stairs

--- Nothing happened this year
That is the achievement, and I want it on the record.
Anyone can be in love during the dramatic part.
We were in love on a Wednesday, about nothing, for twelve months.

--- The shape of a Tuesday
You are awake before you need to be. I am not, and never will be.
Somewhere in the middle of it we find each other
and hand the day over like something warm.

--- Did you eat
The most romantic sentence in this house, and I will not be argued with.
It means: I am thinking about your body from a thousand kilometres away
and I have no way to feed you, so I am asking instead.

--- The list
I keep one without meaning to. Your deadlines. The person who annoys you.
The thing in March you have been dreading since January.
You have never once had to remind me, because loving you made me a better listener.

--- Your bad weeks
The sentences get shorter and you tell me you are fine.
I have learned not to believe it and not to push,
only to stay on the line and let the quiet be somewhere safe.

--- My bad weeks
I go quiet, which is worse, because quiet looks like leaving
to anyone who has ever been left.
I promised you I would stop doing it. I have mostly stopped. I am still working.

--- The month we were both unbearable
February. Neither of us was wrong, which is the worst kind of month.
We were both exhausted, and exhaustion is not a thing you can apologise for,
so we just carried it around and bumped into each other with it.

--- What we did about it
Nothing clever. Nothing anybody would put in a book.
We got to the other side of February by continuing to answer the phone,
which I have come to think is most of what love actually is.

--- The quiet stretch
Two weeks where the calls got shorter and neither of us said so.
I have thought about those two weeks more than about any argument we have had.
That was the only time I was ever frightened.

--- What I decided in it
That I was not going to let this drift.
That drifting is how these things die \u2014 not in a fight, in a slow forgetting \u2014
and that whatever this cost, it was not going to end like that.

--- What you decided
Months later you told me you had decided exactly the same thing
in exactly the same week, and had said nothing either.
We had been quietly refusing to lose each other, alone, at the same time.

--- The repair
There was no conversation about it. We simply began staying on the line longer.
Some things are mended by doing them rather than discussing them,
and this was mended by two people choosing to be reachable.

--- Rain at both ends
It started here while we were talking, and you said it was raining there too.
Neither of us mentioned it again for an hour.
We just sat, a thousand kilometres apart, in the same weather, saying nothing much.

--- The call that dropped four times
And I dialled four times.
If you ever want the whole of this in one line, that is the line.
I will always dial again. That is not romance. That is just what I do.

--- What we talk about
Almost nothing. Food. Somebody's cousin. A bus that did not come. Work.
The content has never once been the point.
The point is your voice arriving, and mine going out, and neither of us hanging up first.

--- What we did not talk about
For a long time, how long this would have to go on.
We are better now. It turns out that saying a hard thing out loud
does not make it longer. It makes it shorter.

--- Your work
You take it more seriously than it takes itself, which is why you are good at it.
Twice this year I watched you quietly fix something that was never yours to fix,
and tell nobody, and I fell for you again both times.

--- My work
You have asked me about it every week for three years.
Not politely. Properly, with follow-up questions, remembering the names.
Nobody in my life has ever done that. I notice it every single time.

--- Money, briefly
There were months when it was tight and I did not say so.
You knew anyway, the way you always know,
and you never once made me say it out loud. I have not forgotten that kindness.

--- The plan, first version
Vague, hopeful, somewhere around "soon".
We both knew it was not a plan. It was a wish with a calendar taped to it.
We let each other have it for a while, because we needed something.

--- The plan, second version
Dates. Actual dates. Written down where both of us could see them.
That was the night this stopped being a hope and became a schedule,
and I slept properly for the first time in about a year.

--- What the waiting cost you
More than it cost me, and I want that written somewhere permanent.
You were the one explaining us to people who did not believe in us.
You defended this in rooms I was not in. I know. I will be paying that back for years.

--- What I stopped needing
Reassurance. Somewhere in that year I simply stopped needing to be told.
You had already told me nine hundred times by turning up,
and a man can only be shown something so often before he finally believes it.

--- The unremarkable middle
This is the year nobody would ever put in a film.
No meeting, no crisis, no scene worth photographing.
It is the year that did it. Everything since has been built on that quiet.

--- The second September
Two years. We were quieter about it than the first.
Quiet is not less. In this house quiet has always meant more \u2014
it means we have stopped needing to announce a thing we are simply doing.

=== 2025 \u2014 2026 | The year you became real | still | doorway, platform, road

--- The year we stopped calling it long
It was just the distance by then. Just a number we lived with,
the way people live with a hill between them and the shops.
Somewhere in here it stopped being an adjective and became furniture.

--- Counting properly
Somewhere in this year I began knowing the number without checking.
I still do. I could tell you tonight, to the day, without looking,
and I would be right, because some arithmetic gets into your body.

--- The date on the calendar
When it was finally set I read it about forty times in one evening,
as though it might be a trick of the light.
It did not change. It sat there being true, and I could not stop looking at it.

--- The week before
I could not concentrate on anything at all.
I did the maths on the journey four times, as though the distance
might have quietly improved while I was not watching.

--- What I rehearsed
Three things to say to you. I had them in order. I practised them.
I said none of them.
I have never been more glad to have wasted a week's preparation.

--- The morning of
Nothing dramatic. I was ready far too early and then had nothing left to do
except sit with my hands on my knees like a boy outside a headmaster's office.
I have never been that frightened of something that was definitely good.

--- The moment before
Standing in a corridor, knowing that in a few seconds you were going to be real \u2014
that a voice I had loved for two and a half years was about to have a height,
and a temperature, and a way of walking toward me.

--- Two hours @twohours

--- Your hands
I had somehow been hearing them for years \u2014 moving, doing something else,
folding something while we talked.
Seeing them was almost more than I could take. They were smaller than I had built.

--- Not knowing what to do
With my own hands, mostly.
Everything I had ever practised with you had been designed for a phone,
and suddenly there was a whole body in the room and none of it was rehearsed.

--- The thing neither of us said
That two hours was not enough. That it was cruel, really, to be given that little.
We both knew it the entire time.
Saying it would have cost us some of the two hours, so we spent them instead.

--- What the light was doing
I could not tell you one sentence either of us said in that room.
I could describe the light exactly \u2014 where it came in, what it did to your face,
how it moved when you did. I have kept it. I take it out.

--- Leaving
I did not look back, which I half regret and would do again tomorrow.
Some things you can only survive in one movement.
I got round the corner and stood still for a while and did not think anything at all.

--- The way back
I sat with nothing in my head for a very long time.
Not sadness exactly. Just the enormous fact of you, going round and round,
and the whole world outside the window looking slightly rearranged.

--- The week after
Everything sounded different on the phone. Same voice, same hour, same nine o'clock.
But the person on the other end had a height now, and hands,
and I was no longer in love with an idea. I was in love with someone specific.

--- What changed
The waiting stopped being theoretical.
Before that day I was waiting for something I had assembled out of a voice.
After it, I was waiting for you \u2014 which is harder, and infinitely better.

--- What did not change
Nine at night.
Did you eat.
Some things do not need improving by two hours in a room.

--- The photograph that exists
There is one. It is not a good photograph by any standard you could name.
It is out of focus and neither of us is ready.
It is the single most valuable object either of us owns and we both know it.

--- Faith becomes memory
Everything before that day was faith \u2014 loving somebody on the strength of a voice
and a promise and your own stubbornness.
Everything after it is memory. I know which of the two I would rather run a life on.

--- What I have been living off
Two hours, stretched across a year and a half.
People go further on less, but not much less.
It has not run out. I have tested it on some very bad nights and it holds.

--- The dance @dance

--- Holding a shape
Years of practice for something that lasts a few minutes and is then gone.
You have never once complained about that rate of exchange.
Neither have I. It is, more or less, exactly what we have been doing.

--- What you are actually like
Funnier than the voice let on. More stubborn. Far less careful with yourself.
I had most of it right from two and a half years of listening,
and everywhere I was wrong, I was wrong in your favour.

--- Bad signal, again
Of course it never stopped. It is Odisha and Bengaluru and monsoon and weather.
It only stopped mattering, at some point, without either of us noticing \u2014
which is the nicest thing I can say about what we have built.

--- The third September
Three years. And this house, which I built on the nights we could not talk,
so that there would be somewhere for all of it to live
that was not only my head, and not only your patience.

=== 2026 \u2014 | Everything still coming | ember | horizon, sea, lamp

--- The distance @distance

--- The house
Not large. Ours. That word is doing an enormous amount of work in that sentence.
I have thought about the doors more than any reasonable man should,
because a door is the difference between visiting someone and living with them.

--- The door
One key. Two people who have it. No arrangements. No last train.
That is the entire fantasy, and I am aware of how small it is,
and I would trade almost anything for it.

--- The table
Somewhere to put things down at the end of a day.
Two cups on it at once, going cold at the same rate,
which is a thing I have wanted for three years and cannot properly explain.

--- Groceries
I want to do the groceries with you. I am not being clever.
I mean it exactly as it sounds \u2014 a bad list, a slow aisle,
you disagreeing with me about rice, both of us in the same fluorescent light.

--- The first meal
I will cook it badly and you will be extremely polite about it,
and I will know, and you will know I know.
I intend to be insufferable about that meal for the next forty years.

--- Boredom
Actual boredom. The same room, nothing planned, neither of us performing.
I want it more than I have wanted most things I have worked for.
Only people who have never had it think boredom is the opposite of love.

--- Two sets of footsteps
In the same corridor, at different times of the evening,
without either of us treating it as an occasion.
That sound. I have been imagining that sound for three years.

--- Your handwriting in my house
On a list. On the back of an envelope. On something I did not ask for.
Small, very exact, unmistakably yours, and simply there when I come in \u2014
proof of you left lying around the place like ordinary weather.

--- The end of a phrase
"When I see you next."
I have said it a few hundred times and I have hated it every single time.
I am looking forward to never needing that sentence again.

--- What I do while you sleep @sleep

--- Your first morning here
You will wake up somewhere that is also mine and be briefly confused about it.
I have thought about that four seconds of confusion more than is healthy.
I want to be the thing you remember at the end of it.

--- The classroom
You in front of them, being difficult about grammar, refusing to let it go.
Some of those children will be different for the rest of their lives
and will never quite work out why. I know exactly why.

--- The first term
You will overprepare and come home flattened and say it went badly.
It will not have gone badly. By the second term you will have found your voice,
and I will be so unbearable about you that people will start avoiding me.

--- Me in the next room
Listening. Not helping. Not needed for any of it.
Just close enough to hear the shape of you being good at something,
which is, it turns out, most of what I have ever wanted.

--- The wedding
Paperwork on something that has been true since a night in September
when neither of us was being careful.
Everyone will get it wrong and think it is the beginning. Let them.

--- Who will cry
Not you. You will be composed and precise and slightly amused by all of us.
I am making no promises whatsoever.
I have been holding this in for three years and I do not rate my chances.

--- What I will say
Nothing I have not already said in here, on a night when you could not sleep.
That is rather the point of having said it in here first.
By then it will all be old news, which is exactly how I want it.

--- The years
Forty of them, if we are lucky and sensible and reasonably careful with ourselves.
I have already spent three on the telephone.
I would spend three more tomorrow if that were the price of the other forty.

--- Getting old
I want to be old with you specifically. Not in general. Not with someone.
Difficult, both of us, in the same house, for a very long time,
arguing about the heating, knowing exactly how the other takes their tea.

--- The story, badly told
Somebody will ask how we met and we will start in different places
and interrupt each other and neither version will be right.
I will let you win. I always do. It is one of my few reliable pleasures.

--- What I would sign for
All of it again. Including February. Including the two weeks of quiet.
Including every dropped call and every night I could not reach you.
Without reading a single line of it first.

--- What I am on the hook for
Twelve things. They are written down in this house where you can find them.
I do not get to mark my own work.
You are the one who says when one of them has been kept.

--- The hold @hold

--- Tomorrow, again
The only promise in here that has to be renewed every single day.
It has been. One thousand and ninety-something times so far,
and I intend to keep renewing it until somebody stops me.

I did not build this because there was an occasion. The occasion only made me finish it. I built it on the nights the signal went, when I had a whole evening of things to tell you and nowhere to put them, and I got tired of carrying them around until nine o'clock the next day.

So this is where I have been putting them. There are letters in here you will not need for a long time. Some of them will not open for years \u2014 I mean that literally, the dates are locked into the thing, and I cannot open them either from where I am sitting.

Take whatever you need tonight. Leave the rest sealed. It keeps. I made it to keep.`},{id:"cannot-sleep",open:"when you cannot sleep and the hour has gone strange",kind:"anytime",weight:10,body:`Put the phone down in a minute. Not yet. Stay here with me for a moment first.

You are not behind on anything. Whatever it is you are turning over at this hour has not started yet, and it will be smaller in the morning than it is now \u2014 everything is smaller in the morning. The dark makes things enormous. It is very good at that and it is lying to you.

Nobody solves anything at three in the morning. Nobody has ever, in the history of the world, lain awake and reasoned their way out of it. You are not failing at something. You are just awake.

So: put your feet somewhere warm. Let your shoulders down from around your ears \u2014 you are doing it now, I know you are. Breathe out for longer than you breathed in.

I am asleep, or I am lying in the dark doing exactly this, a thousand kilometres from you, under the same enormous sky, thinking about your hands. Either way I am on the other end of it. Close your eyes, my love. The morning is much closer than it feels, and I will be in it.`},{id:"after-a-fight",open:"when we have just fought and the house feels wrong",kind:"anytime",weight:11,body:`I am still here.

Whatever I said, and whatever you said, and whatever either of us meant by it \u2014 I am not leaving over this. Neither are you. We both know that in the part of us that is not currently furious, and it is only fear that makes it feel otherwise for an hour or two.

I would rather be wrong with you than right on my own. I mean that plainly. If I was wrong, I will say so, and I will not wrap it in the paragraph that quietly takes it back. Give me a little time to stop being proud about it. I am slower at that than you are.

Do not go to sleep believing this is the shape of us. This is weather. It came in off the sea and it will go out again, and the house will still be standing in the morning with the lamp on and everything where we left it.

Come back when you are ready. I will be exactly here. I am always exactly here.`},{id:"bad-missing",open:"when you miss me and it is not the nice kind",kind:"anytime",weight:12,body:`I know the difference. The nice one is warm, and you can hold it, and it makes you smile at your phone in a queue. This one has teeth. This one sits on your chest at nine at night for no reason at all and will not be reasoned with.

I get it too. Usually around the same hour. Usually on a completely unremarkable Tuesday when nothing has happened and there is nothing to point at.

I have decided it is the cost, and I pay it without complaining, because the alternative was a life in which I never found out what your voice does when you are about to laugh. That was the other option. That was the whole other option, and I would not take it now for anything on this earth.

It is not forever. I want to be careful and not promise you a date I cannot keep, but I will say this as flatly as I can: it is not forever. There is a version of us where I am irritating you from the next room and you would quite like ten minutes of peace, and we are walking towards it, and we are closer to it tonight than we were last night.

Until then \u2014 this is real even when it hurts. Especially then. The teeth are just the size of it.`},{id:"proud-alone",open:"when you did something well and nobody noticed",kind:"anytime",weight:13,body:`I noticed. Tell me what it was.

I want the whole thing. Including the boring part in the middle. Including the part where you were sure it was going badly and carried on anyway, which is the part you will skip and which is the part I want most.

You have a habit I have watched for three years: you finish something difficult and immediately start looking round for the next difficult thing, as though stopping to be pleased with yourself would be a kind of showing off. It is not. Nobody thinks that. I certainly do not.

Stop for a minute. I am asking you properly. Be pleased where I can see it, and let me be unbearable about you for a little while \u2014 I am extremely good at it and I get so few chances.

You did a good thing today and somebody should have said so. I am saying so.`},{id:"doubt",open:"when you doubt this, and doubt yourself for doubting",kind:"anytime",weight:14,body:`Good. Doubt it. I would far rather be chosen by someone who checked.

Here is what I would put in front of you. Three years. One thousand two hundred and eighty-seven kilometres. Bad signal, a monsoon, two hours in the same room in the whole of it, almost no photographs, no shared city, no shared kitchen, none of the ordinary machinery that is supposed to hold two people together.

And it held. Not because either of us was heroic about it. Because we kept turning up. Because at nine o'clock, on the bad days as well as the good ones, one of us dialled and the other one answered, and we did that about a thousand times.

That is the whole argument, and it is not a romantic one. It is better than romantic. Romantic is cheap and easy and available to anyone with a free evening. Turning up for three years is not.

If there is something you need to ask me directly, ask it. Tonight, in the middle of a sentence, however it comes out. I will not be hurt by the question, and I will not be careful with the answer.`},{id:"cruel-day",open:"when the day was cruel to you",kind:"anytime",weight:15,body:`You do not have to be gracious about it tonight.

Say the unfair thing. Say the version where you are completely right and they are completely, unforgivably wrong, and leave out all the mitigating detail you would normally put in because you are scrupulous even when you are hurt.

You can be reasonable tomorrow. Tomorrow you will be reasonable automatically, you always are, it is practically a reflex. Tonight you get to be furious, and I will agree with every single word without checking any of it, and I will not once say "well, to be fair".

You are allowed to have had a bad day without it meaning anything at all about who you are. It was just a day. It was cruel and it is over.

Come here. Put it down.`},{id:"strong-one",open:"when you are tired of being the strong one",kind:"anytime",weight:16,body:`Then be tired here.

You do not have to hold anything up in this house. Nothing in it depends on you being capable tonight. Nothing in it will fall over if you stop.

In three years I have never needed you to be all right. Not once. I have only ever needed to know which one it is tonight, so that I know whether to talk or to shut up, and you can tell me that in one word if one word is what you have.

You are the person everyone in your life leans on. I have watched it from a thousand kilometres away and I have wanted, more times than I can tell you, to stand between you and all of them for an afternoon.

I cannot do that from here yet. What I can do is this: put it down. It will still be there. I am not asking you to be strong \u2014 I am asking you for the truth, which is harder, and which you have always been much better at than you think.`},{id:"ill",open:"when you are ill and I am not there",kind:"anytime",weight:17,body:`This is the one I hate. This is the one I built this whole house to avoid feeling, and it did not work.

Eat something small. Anything. Drink water in front of me on a call so that I can watch you do it and stop imagining the worst. Tell somebody in the house that you are not well \u2014 actually tell them, out loud, at the time, not afterwards as a footnote once you are better.

I cannot bring you anything from here. I cannot put my hand on your forehead or make you the thing you like or take the day off and sit at the end of the bed being quietly annoying. It makes me useless in a way I have never made peace with, and I do not think I will.

So let me do the only thing I can do from Bengaluru, which is ask you every hour whether you have eaten, and let me be insufferable about it, and do not tell me you are fine.

Get better. That is not a request.`},{id:"beautiful",open:"when you want to hear it said plainly",kind:"anytime",weight:18,body:`You are beautiful. I am not going to be clever about it, or hedge it, or bury it in a joke the way I usually do.

You are beautiful, and I have thought so from a badly lit photograph in a doorway, and I thought so in a corridor in May, and I think so on a bad line at nine at night when I cannot see you at all.

But that is not the first thing I would say if someone stopped me in the street and asked me to describe you, and I want you to know what is.

You are exact. You find the right word and you will wait for it rather than use the near one. When you listen you actually stop \u2014 you put the other thing down, which almost nobody does. You get quieter when something matters instead of louder. You are gentle with people who can do nothing for you. You take a long time to trust and then you do it completely, with your whole self, no part of it held back.

You hold a shape until it means something. I have watched you do that with your hands and with your whole life, and I have been trying to learn it from you for three years.

Yes. And beautiful.`},{id:"no-signal",open:"when the signal is gone and you cannot reach me",kind:"anytime",weight:19,body:`I wrote this one knowing exactly when you would read it.

Nothing has happened. I am not angry, I am not gone, I have not changed my mind between one bar and none. The signal has no opinion about us. It never has.

This whole house works with no connection at all. That was the very first decision I made about it, before a single word of it was written \u2014 that it had to work in a dead spot, on a train, in a storm, on the worst night of a bad week when the world has quietly disconnected you. Every letter in here opens on a dead network. That was the entire point.

So read whatever you need. Say whatever you want to say into the writing room; it will hold it for you, and you can send it when the world comes back and stops being ridiculous.

I am at the other end of a line that is temporarily not working. That is all this is. I am still here, on the other side of the weather, waiting for it to clear.`},{id:"happy",open:"when you are happy and want it witnessed",kind:"anytime",weight:20,body:`Tell me. Tell me the small one \u2014 the one you have already decided is not worth a call.

I have noticed that you save the good things up. You collect them quietly until there are enough of them to justify the interruption, as though joy needed a quorum before it could be reported.

There is no minimum. There is no interruption. The bar is on the floor and I put it there myself.

A good cup of tea qualifies. Weather qualifies. A sentence you overheard on a bus qualifies. Say it out loud and let it be seen, because half of what a person is actually for is being the one who saw it.

I want the whole unremarkable inventory of your happiness. I have three years of it and I want three hundred more.`},{id:"rest",open:"when you need permission to rest",kind:"anytime",weight:21,body:`Granted. Not that it was ever mine to give.

Nothing is going to collapse. You have built the thing you are worried about carefully enough that it survives one day of you lying down, and if it does not, then it was going to fall over anyway and much better today, while you are awake to watch.

Rest is not a reward for having finished. It is not something you earn by being sufficiently exhausted first. You do not have to have deserved a Sunday.

Lie down. Put something on you have already seen. Let the day go on without your supervision for a few hours \u2014 it will manage, it always manages, and you are the only one who has not noticed.

I will still be here at nine, and I will not ask you what you got done.`},{id:"angry-at-me",open:"when you are angry at me and I have not noticed",kind:"anytime",weight:22,body:`Tell me. Plainly, and without softening it first, and without waiting until you have worked out whether you are entitled to it.

I would much rather be told badly than not told at all. I would rather have one hour of you being sharp with me than a whole week of you being polite, because I know what your politeness sounds like when something is wrong underneath it, and it is the loneliest sound I know.

I miss things. I am not proud of it and I am not going to pretend it is charming. But go back through three years and find me one time I was angry with you for telling me. There is not one. There is not going to be one.

Say it tonight. I will not get defensive first, or at least I will try not to, and if I do, wait ten minutes and I will come back and do it properly.

We are much better at this than we were. That happened because you kept telling me.`},{id:"why",open:"when you cannot remember why we are doing it this way",kind:"anytime",weight:23,body:`Because you were worth arranging a life around, and arrangements take time.

That is it. That is the whole reason, and it has never once wavered. Everything difficult about this \u2014 the distance, the waiting, the two hours we have had in one room in three years, the birthdays on a screen \u2014 is the cost of a decision I would make again on the worst day of it, in the worst hour of the worst day, without needing to think about it.

We are not being patient. Patience is passive; patience is what you do in a waiting room. We are building something with a long lead time, and there is a difference, and the difference matters.

Every anniversary so far has been on a phone. The next ones will not be. Every one of these nights has been paying for that.

You are not waiting for nothing, Smruti. You are waiting for the rest of it.`},{id:"brave",open:"before something you are dreading",kind:"anytime",weight:24,body:`You will be fine, and I know how much you hate being told that, so here is the useful version.

You have done harder things than this with less warning and no time to prepare. You do not fall apart under pressure \u2014 you go very quiet and very precise, and people mistake it for calm, and you let them, and it works every single time.

Let them think you are calm. That is a perfectly good disguise and you wear it beautifully.

It will take less time than the dread did. It always does. The dread is nearly always the longer and worse of the two, and you have almost finished the dread part now.

Text me when it is over. One word is enough \u2014 I do not need the report tonight, I only need to know you are on the other side of it. I will be thinking about you the whole time, if that helps, and if it does not help then ignore me and go.`},{id:"quit",open:"when you want to quit something",kind:"anytime",weight:25,body:`Then quit it.

I am completely serious. Not everything is a test of character. Some things are simply a bad fit that you have stayed loyal to long past the point of sense, because you are the sort of person who finishes what she starts, and that is usually a virtue and occasionally a trap.

One question, and then I will stop. Are you leaving because it is wrong, or because today was hard?

If it is today \u2014 sleep first, and ask me again tomorrow, and I will ask you the same question in the same tone.

If it is wrong, then leave, and I will not ask you to justify it to me. Not once. Not later. Not in three years, in an argument, when I am looking for something to throw. That is a promise and it is written down now.

You are allowed to change your mind. It is your one life and it is yours.`},{id:"crying",open:"when you have been crying and do not want to say why",kind:"anytime",weight:26,body:`Then do not say why.

I do not need a reason handed to me. You are allowed to be sad without a cause that would hold up if somebody examined it, and you are allowed to be sad about something small, and you are allowed to be sad about something you cannot name.

Sit here for a minute. Nothing in this house is going to ask you a question or need anything from you. It is only a lamp and some words and a man who loves you, all of it switched on and waiting and none of it in any hurry.

When you want to talk I am one message away, at any hour, and I do not care what hour.

And if you never explain this particular night to me \u2014 not tomorrow, not next year, not ever \u2014 that is completely fine, and I will not bring it up, and it will not be a thing between us. Some nights are just weather.

Put your head down. I have got you.`},{id:"birthday",open:"on your birthday",kind:"sealed",on:"06-13",weight:40,body:`Happy birthday.

I have been thinking for weeks about what I actually want for you this year, and it is not a bigger year. You have had big years. You have had years that asked far too much and got it, because you always give it.

I want you to have an easy one. A year where the ordinary parts are good. Where the mornings are not a negotiation. Where nothing has to be survived and nobody needs you to be the capable one and the whole thing is simply, unremarkably, kind to you.

You are one year further into being the person you have been trying to become since the night I met you, and I want to tell you, from where I am standing, with the best view anyone has: it is working. It is visibly working. You are becoming her.

I will say the rest of it out loud today, badly, probably at the wrong moment, and you will laugh at me. This part is just so that it is written down somewhere permanent, in case you ever need to check.

I am so glad you were born. That is the whole of it, underneath everything else. Of all the people who have ever lived, you, and here, and now, and me.`},{id:"year-four",open:"on the fourth September",kind:"sealed",on:"2027-09-02",weight:41,body:`Four years.

I do not know what this year was. I am writing this in 2026 with absolutely no idea what happened to us between then and now, which is the strange and slightly frightening part about sealing a letter \u2014 I have to love you without knowing what I am loving you through.

So here is what I know is still true, whatever it turned out to be.

I stayed. If this was the hard year, I stayed through it and I did not go quiet on you. If it was the good one, I did not get careless with it, and I did not start taking any of it for granted, because I have never once been able to.

Four Septembers. The first one we did not make a fuss about. I hope by now we make a fuss. I hope by now there is a table and two cups on it and somebody has bought something ridiculous.

Tell me what happened this year. I know I was there for it. Tell me anyway \u2014 I like the way you tell things, I always have, and I have never once been bored by you.`},{id:"ten-years",open:"on the tenth September",kind:"sealed",on:"2033-09-02",weight:42,body:`Ten years.

If you are reading this then the file survived, which means somebody kept moving it from phone to phone for seven years, and I think we both know which one of us it was.

I wrote this in 2026, when we had been apart for almost the whole of it and had spent two hours in the same room. Two hours, in three years. By now that sentence should read as history \u2014 something that happened to two younger people who did not know how it was going to turn out.

I hope it is genuinely difficult for you to remember what that was like. I hope you have to stop and think. I hope the version of me sitting next to you now is so ordinary and so present that the man who wrote this seems slightly dramatic.

He was. He was also right.

I have loved you at a distance for longer than most people manage it up close, and then, I hope, up close for longer still. Whatever else I turned out to be over these ten years \u2014 whatever I got wrong, and I will have got things wrong \u2014 I was steady. Hold me to it. Keep holding me to it.

Ten years, Smruti. And I would still dial again.`},{id:"first-class",open:"the day you stand in front of your first class",kind:"sealed",on:"2028-06-01",weight:43,body:`They have no idea what they are getting.

You are going to be exact with them, and a little severe, and completely fair, and they are going to work harder for you than for anyone else in that building and not fully understand why until they are thirty.

I have watched you explain things to me that I already knew, purely because I wanted to hear how you would do it. You slow down. You find the one word and you refuse the nearly-right one. You wait for the person to actually arrive at it rather than handing it over. It is the same thing you do when you dance, and it is the same thing you did to me on the second of September, and it works.

Some of them are going to be difficult. Some of them are having a worse year than they will tell you. You will notice \u2014 you always notice \u2014 and you will do something quiet about it that nobody will thank you for, and it will matter for the rest of their lives.

Do not overprepare tonight. You know it. You have known it for years.

Go on. I will be in the next room, listening to a voice I have loved since before I ever saw it, being good at something.`},{id:"wedding-week",open:"the week of the wedding",kind:"sealed",on:"2027-11-24",weight:44,body:`Almost.

Everyone is going to want something from you this week, and most of it will not matter in a month, and none of it will matter in a year. Let it be a bit of a mess. The parts you will actually remember are not on anybody's list \u2014 they never are.

I want to say one thing before the noise starts, while it is still just us and a file on your phone at whatever hour you have found to read this.

I did not spend three years waiting for you. I want to be precise about that, because people will say it this week and they will mean it kindly and they will be wrong. I did not wait. I spent three years with you. Nine at night, every night, through a monsoon and a bad February and a signal that came and went. That was not the waiting room. That was the marriage. We have been doing it for years; on Wednesday we are just telling everyone.

The wedding is not the beginning of anything. It is paperwork on something that has been true since a night in September when neither of us was being careful.

I will see you at the end of the week. I will be the one who cannot stop looking at you.`},{id:"third-september",open:"on the third September",kind:"sealed",on:"2026-09-02",afterHour:!0,weight:45,body:`You have been to the hour by now, so I can say this part plainly.

I did not know, when I started building this, that I would end up writing a letter for the far side of a night that had not happened yet. That is a strange thing to do. It is also the most honest thing in the house, because it means I was betting on you being there \u2014 on a Tuesday in September, at nine o'clock, with your phone in your hand, in a room I have never stood in.

You were. Of course you were. You always are. That is the entire discovery of my adult life and I keep making it.

Three years, and every one of them on a telephone. I want to write down what that actually cost, because nobody who tells this story later is going to get it right. It cost you the ordinary version of being loved. Somebody at the door. Somebody who notices your face and not just your voice. You gave that up for three years on the strength of a bet, and you never once made me feel the size of it.

I have not forgotten. I am not going to.

There is a room ahead of us where all of this is over. Where nine o'clock is not an appointment. Where I am simply in the next room being irritating, and you know exactly where I am without checking, and none of this house is necessary any more.

Keep it anyway. Not because we will need it. Because one day somebody is going to ask you how we managed it, and you will start in the wrong place, and I will interrupt, and neither of us will get it right \u2014 and this will still be here, saying it properly, in my own words, from the year we were still counting.

Go to sleep. I am glad it was you. I have been glad every single day.`},{id:"once",open:"the one you can only open once",kind:"once",weight:60,body:`You spent it. I would have too.

Here is the thing I was keeping.

I have never, in three years, had to convince myself. Not once. Not on the nights the call dropped four times, not in the month we were both unbearable, not in that fortnight of quiet when I was more frightened than I ever told you, not on the long unremarkable stretches where nothing was happening and it would have been so easy to drift.

People talk about love as though it were a decision you keep making, a thing you renew, a discipline. Mine has never been like that. Mine has been more like a fact I keep rediscovering \u2014 in the morning, slightly surprised, the way you notice that the sun came up again and think, well, of course.

I did not choose you once, on a night in September. I have simply woken up every day for three years and found that it was still true, and that it had gone on being true while I slept, without my supervision, like something growing.

That is what I was keeping behind one door so that it would not get worn smooth by being said too often.

k is kept, permanently, and it is safe with me. That is not a favour. That is the minimum.",made:"2024-02-14"},{id:"sorry",text:"I apologise without the paragraph that takes it back.",detail:"No \u201Cbut\u201D. No careful explanation of the reasonable process by which I arrived at being wrong. Just the apology, on its own, unaccompanied, the way you have always given them to me.",made:"2024-06-11"},{id:"not-a-task",text:"I will not become something you have to manage.",detail:"My moods are mine. My bad weeks are mine to carry. You are not responsible for keeping me level and you never will be, and if I ever start quietly putting that on you I want you to say so on the day you notice, not two years later.",made:"2024-09-02"},{id:"interested",text:"I stay actually interested in your work.",detail:"Not politely interested. Properly. I want the names of the people who annoy you and the details that would bore anybody else and the thing that went well that you have decided is not worth mentioning. I have asked every week for three years and I have never once had to make myself.",made:"2025-01-19"},{id:"no-shrinking",text:"I am never the reason you make anything smaller.",detail:"Not your ambition. Not your opinions. Not the amount of room you take up in a conversation with other people in it. You have spent your life being the reasonable one; you do not have to be the smaller one as well. If I am ever the reason, tell me, and I will fix it rather than explain it.",made:"2025-03-30"},{id:"small-dates",text:"I remember the small dates, not only the big one.",detail:"The third of May is in here. So is the second of September. So are the ones that are only ours and would mean nothing to anybody else, and those are the ones I am proudest of remembering.",made:"2026-05-03"},{id:"lamp",text:"I keep the lamp on.",detail:"Whatever hour you arrive at. Whatever state you are in. Whatever it is you have to tell me and however badly it comes out. The light is on, the door is unlocke
